<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lists</title>
  </head>
  <body>
    <!--type can be used to provide the point style like disc, square and circle. default disc/!-->
    <h1>unordered list</h1>
    <ul type="circle">
      <li>101</li>
      <li>102</li>
      <li>103</li>
    </ul>
    <!--here also type can be used to select point style like i, I, A, a, 1 etc./!-->
    <h1>ordered list</h1>
    <ol type="I">
      <li>101</li>
      <li>102</li>
      <li>103</li>
    </ol>
    <!--definition list is said to be not used widely/!-->
    <h1>definition list</h1>
    <dl>
      <dt>html</dt>
      <dd>hypertext markup language</dd>
      <dt>css</dt>
      <dd>cascading style sheet</dd>
      <dt>javascript</dt>
      <dd>to provide interactivity</dd>
    </dl>
  </body>
</html>
